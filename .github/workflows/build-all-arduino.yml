name: Build & Release Firmware for ESP32-C6

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🏷️ Generate timestamp tag
      id: gen-tag
      run: |
        TAG=$(date -u +'%Y.%m.%d-%H%M')-${GITHUB_SHA::7}
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Generated tag: $TAG"

    - name: 🔍 Check if release already exists
      id: check-release
      run: |
        TAG="${{ steps.gen-tag.outputs.tag }}"
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Create and push git tag
      if: steps.check-release.outputs.exists == 'false'
      run: |
        TAG="${{ steps.gen-tag.outputs.tag }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$TAG"
        git push origin "$TAG"

    - name: 🛑 Skip if release exists
      if: steps.check-release.outputs.exists == 'true'
      run: |
        echo "✅ Release already exists for tag ${{ steps.gen-tag.outputs.tag }} — skipping build."

    - name: 🔧 Setup Arduino CLI
      if: steps.check-release.outputs.exists == 'false'
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        sudo mv bin/arduino-cli /usr/local/bin/
        arduino-cli version
        arduino-cli config init
        arduino-cli config set library.enable_unsafe_install true
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.2.0
        arduino-cli lib install "IRremote"
        arduino-cli lib install "Adafruit NeoPixel"
        arduino-cli lib install "NimBLE-Arduino"
        arduino-cli lib install "ESP32-BLE-Gamepad"
        arduino-cli lib install "Adafruit BusIO"
        arduino-cli lib install "Adafruit Unified Sensor"
        arduino-cli lib install "Adafruit MPU6050"
        arduino-cli lib install "SparkFun BMI270 Arduino Library"
        arduino-cli lib install "WiFiManager"
        arduino-cli lib install "WebSockets"

    - name: 🏗️ Create build directory
      if: steps.check-release.outputs.exists == 'false'
      run: mkdir -p compiled_binaries

    - name: 🚀 Build all firmware
      if: steps.check-release.outputs.exists == 'false'
      run: |
        chmod +x ./build_all_esp32c6.sh
        ./build_all_esp32c6.sh || true

    - name: 📦 Package artifacts
      if: steps.check-release.outputs.exists == 'false'
      run: |
        mkdir -p artifacts

        for dir in compiled_binaries/*/; do
          project=$(basename "$dir")
          mkdir -p "artifacts/$project"
          find "$dir" -name "*.bin" -exec cp {} "artifacts/$project/" \;
        done

        echo "=== Per-project binary folders ==="
        find artifacts -type d -mindepth 1 -exec sh -c 'echo "{}:"; ls -lh "{}"' \;

        cd artifacts
        for d in */; do
          zip -r "${d%/}.zip" "$d"
          rm -rf "$d"
        done
        cd ..

        echo "=== Final release assets ==="
        ls -lh artifacts

        echo "=== Failed Build Logs ==="
        find compiled_binaries -name "compile.log" -exec sh -c 'echo "\n{}:"; cat {}' \;

    - name: 📤 Upload artifacts
      if: steps.check-release.outputs.exists == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binaries
        path: artifacts/*.zip

    - name: 🏷️ Create GitHub Release
      if: steps.check-release.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.gen-tag.outputs.tag }}
        name: Release ${{ steps.gen-tag.outputs.tag }}
        body: Automatic release of firmware version ${{ steps.gen-tag.outputs.tag }}
        files: artifacts/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}